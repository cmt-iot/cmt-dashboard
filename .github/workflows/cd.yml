name: CD

# Required repo secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST          - VPS IP/hostname
#   VPS_USER          - SSH user
#   SSH_KEY      - private key matching a pubkey authorized on the VPS
#   VPS_SSH_PORT      - optional, defaults to 22
#   VPS_DEPLOY_PATH   - optional, defaults to ~/cmt-dashboard
# GITHUB_TOKEN (auto-provided) pushes images to ghcr.io — no extra secret needed.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/cmt-dashboard

jobs:
  # CI Build pushes the backend/frontend/nodered images to GHCR
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: backend
            context: backend
          - service: frontend
            context: car-monitor
          - service: nodered
            context: node-red
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  # CD Deploy pulls the images and recreates the containers on the VPS
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy — pull images and recreate containers
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.SSH_KEY}}
          port: ${{ vars.VPS_SSH_PORT || 22 }}
          script: |
            cd ${{ vars.VPS_DEPLOY_PATH || '~/cmt-dashboard' }}
            docker compose pull
            docker compose up -d --remove-orphans
